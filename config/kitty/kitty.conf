# Coins Arrondis
window_padding_width 30
border_on_start no
window_corner_radius 30

# Suppression des décorations de fenêtre
window_border_width 10
hide_window_decorations yes 

# Intégration Pywal (ajoutée précédemment)
include ~/.cache/wal/colors-kitty.conf

# Transparence (APRÈS l'include, sinon pywal la remet à 1.0)
background_opacity 0.7
